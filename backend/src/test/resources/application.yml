# Safe test-only settings with no secrets and no placeholders needing values.
# Committed so CI passes without the real application.yml.
spring:
  application:
    name: payresolve-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: false
  ai:
    google:
      genai:
        api-key: dummy-test-api-key
        chat:
          options:
            model: gemini-2.0-flash
          enabled: false

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /api/swagger-ui.html

payresolve:
  public-url: http://localhost:8080
  demo-mode: true
  session-timeout: 30m
  cors:
    allowed-origins: http://localhost:5173
  supabase:
    url: https://test-ref.supabase.co
    anon-key: test-anon-key
  paypal:
    base-url: https://api-m.sandbox.paypal.com
    client-id: test_client_id
    client-secret: test_client_secret
    webhook-id: test_webhook_id
  ai:
    provider: gemini
  auth:
    operator-username: operator
    operator-password: test_operator_password
    viewer-username: viewer
    viewer-password: test_viewer_password
