# Safe test-only settings with no secrets and no placeholders needing values.
# Committed so CI passes without the real application.yml.
spring:
  application:
    name: payresolve-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

payresolve:
  public-url: http://localhost:8080
  demo-mode: true
  session-timeout: 30m
  cors:
    allowed-origins: http://localhost:5173
  paypal:
    base-url: https://api-m.sandbox.paypal.com
    client-id: test_client_id
    client-secret: test_client_secret
    webhook-id: test_webhook_id
  auth:
    operator-username: operator
    operator-password: test_operator_password
    viewer-username: viewer
    viewer-password: test_viewer_password
