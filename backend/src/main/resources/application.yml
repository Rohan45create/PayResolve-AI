server:
  port: 8080

spring:
  application:
    name: payresolve
  datasource:
    # Supabase PostgreSQL connection string (supports pooler port 6543 or direct port 5432)
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres?sslmode=require}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# PayPal Sandbox configuration
paypal:
  base-url: ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
  client-id: ${PAYPAL_CLIENT_ID:mock_client_id}
  client-secret: ${PAYPAL_CLIENT_SECRET:mock_secret}
  webhook-id: ${PAYPAL_WEBHOOK_ID:mock_webhook_id}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
